name: Build LSPosed Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build with Gradle
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Home18Grid-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0-${{ github.run_number }}
          name: HyperFree v1.3.0-${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/release/*.apk
          body: |
            HyperOS 系统自由定制框架 · LSPosed 模块构建产物
            - 设置界面：一级分类（桌面）→ 二级独立开关，纯手写 Material 3 Expressive
            - 跨进程配置：xposedsharedprefs + XSharedPreferences 热读取
            - 开关仅裁剪尺寸面板选项，不动数据层与渲染层，已有文件夹不丢
            - 支持规格：18 宫格 6x3 / 横向三宫格 3x1 / 纵向三宫格 1x3
