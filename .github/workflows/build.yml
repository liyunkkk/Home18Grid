name: Build LSPosed Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build with Gradle
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Home18Grid-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Home18Grid Release v1.0.0-${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/release/*.apk
          body: |
            HyperOS 18 宫格大文件夹 LSPosed 模块构建产物
            - 适配 ENH 桌面 (com.miui.home.folder.*)
            - 6x3 等分微型网格预览
            - 18 个图标全部支持直接点击启动
